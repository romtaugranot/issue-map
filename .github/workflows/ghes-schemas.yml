# New GHES and GitHub schemas arrive through a pull request (ADR 0004): weekly,
# scripts/ci/schemas.ts records the GraphQL schema GitHub publishes for
# github.com, GHEC and every promised GHES release, and a change opens one.
# The contract tier's schema checks then run against it. Pull requests opened
# with the workflow's own token don't start other workflows: close and
# reopen it to run the contract tier. A failed weekly run opens an Issue, or
# adds to the one open.
name: GHES schemas

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: record
        run: |
          {
            echo "changed<<EOF"
            node scripts/ci/schemas.ts
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: ci/ghes-schemas
          commit-message: Record GitHub's published GraphQL schemas
          title: Record GitHub's published GraphQL schemas
          body: |
            GitHub published schemas the Map's schema checks don't hold yet (ADR 0004):

            ${{ steps.record.outputs.changed }}

            The contract tier checks every query the GitHub adapter sends against them.

  drift:
    needs: schemas
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an Issue, or add to the one open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Recording GitHub's published GraphQL schemas failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again on $(date -u +%F): $RUN"
          else
            gh issue create --title "$title" --body "The weekly run couldn't record the GraphQL schemas GitHub publishes, or open their pull request: $RUN. Fix it in a patch release (ADR 0004)."
          fi
