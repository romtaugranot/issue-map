# The GitLab version matrix (ADR 0004): every GitLab minor the Map promises,
# as CE and EE, one per job on a hosted runner. Which minors that is comes
# from scripts/ci/versions.ts, worked out from the bands each run, so a
# GitLab released after a plugin release is in the next run. The weekly run
# tests only the oldest and newest minors, the full matrix costing a private
# repository's Actions minutes for a month; a release runs every one.
#
# Each job runs that GitLab's image over HTTPS at gitlab.test, seeds the
# GitLab Free Fixture on it, and reads it back through the real adapter,
# exactly as the nightly tier reads gitlab.com. EE runs unlicensed: licensed
# self-managed tiers are stood in for by the licensed group on gitlab.com
# until GitLab agrees in writing that a self-generated test licence in
# public CI falls under the EE licence's "development and testing" clause.
# Only then is the repository variable GITLAB_LICENCE_AGREED set to `true`,
# and the licensed steps below run.
name: GitLab matrix

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these minors, such as 16.0-ee, 19.4 (both editions), or ends (the oldest and newest); empty runs every promised one"
        required: false
        default: ""
  workflow_call:

permissions:
  contents: read

env:
  GLAB_VERSION: "1.119.0"
  # glab's published checksum for that version's linux_amd64 .deb; change both together.
  GLAB_SHA256: "95a9ca105518dec7f70ee403d98501402a5fda154c406f4f4cd6696928d3a098"

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: versions
        env:
          ONLY: ${{ github.event_name == 'schedule' && 'ends' || inputs.only }}
        run: |
          matrix=$(node scripts/ci/versions.ts gitlab "$ONLY")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  gitlab:
    needs: versions
    name: GitLab ${{ matrix.version }} ${{ matrix.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      GITLAB_HOST: gitlab.test
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/ssl/gitlab.test.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install glab
        run: |
          curl -fsSL -o glab.deb "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${GLAB_VERSION}/glab_${GLAB_VERSION}_linux_amd64.deb"
          echo "$GLAB_SHA256  glab.deb" | sha256sum -c -
          sudo dpkg -i glab.deb
      # The adapters reach a Tracker only over HTTPS, so the GitLab gets a certificate this runner trusts.
      - name: Trust gitlab.test
        run: |
          mkdir -p ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=gitlab.test" -addext "subjectAltName=DNS:gitlab.test" \
            -keyout ssl/gitlab.test.key -out ssl/gitlab.test.crt
          sudo cp ssl/gitlab.test.crt /usr/local/share/ca-certificates/gitlab.test.crt
          sudo update-ca-certificates
          echo "127.0.0.1 gitlab.test" | sudo tee -a /etc/hosts
      - name: Start ${{ matrix.image }}
        run: |
          docker run --detach --name gitlab --hostname gitlab.test --publish 443:443 --shm-size 256m \
            --volume "$PWD/ssl:/etc/gitlab/ssl" \
            --env GITLAB_OMNIBUS_CONFIG="external_url 'https://gitlab.test'; letsencrypt['enable'] = false; prometheus_monitoring['enable'] = false; nginx['ssl_certificate'] = '/etc/gitlab/ssl/gitlab.test.crt'; nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/gitlab.test.key'" \
            "${{ matrix.image }}"
      - name: Wait for it to answer
        run: |
          # Its API refuses an anonymous request once it's up.
          for _ in $(seq 1 120); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://gitlab.test/api/v4/version || true)
            if [ "$status" = 401 ]; then exit 0; fi
            sleep 15
          done
          docker logs --tail 200 gitlab
          exit 1
      - name: Make a token for root
        run: |
          token="glpat-$(openssl rand -hex 16)"
          echo "::add-mask::$token"
          docker exec --env TOKEN="$token" gitlab gitlab-rails runner '
            token = User.find_by_username("root").personal_access_tokens.new(name: "matrix", scopes: [:api], expires_at: 2.days.from_now)
            token.set_token(ENV["TOKEN"])
            token.save!'
          echo "GITLAB_TOKEN=$token" >> "$GITHUB_ENV"
      # The schema recorded from each version's EE is what licensed tiers the build can't run are checked against (ADR 0004); it's recorded before seeding, so a seeding failure doesn't lose it.
      - name: Record the GraphQL schema
        if: matrix.edition == 'ee'
        run: |
          node --input-type=module -e '
            import { getIntrospectionQuery } from "graphql";
            import { writeFileSync } from "node:fs";
            const response = await fetch("https://gitlab.test/api/graphql", {
              method: "POST",
              headers: { "content-type": "application/json", "private-token": process.env.GITLAB_TOKEN },
              body: JSON.stringify({ query: getIntrospectionQuery() }),
            });
            const text = await response.text();
            if (!JSON.parse(text).data?.__schema) throw new Error(`no schema in the answer: ${text.slice(0, 500)}`);
            writeFileSync("schema.json", text);'
      - if: matrix.edition == 'ee'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitlab-${{ matrix.version }}-ee-schema
          path: schema.json
      - name: Apply a test licence
        if: matrix.edition == 'ee' && vars.GITLAB_LICENCE_AGREED == 'true'
        env:
          LICENCE: ${{ secrets.GITLAB_TEST_LICENCE }}
        run: |
          docker exec --env LICENCE="$LICENCE" gitlab gitlab-rails runner 'License.create!(data: ENV["LICENCE"])'
      - name: Seed the GitLab Free Fixture
        run: node scripts/fixtures/seed.ts gitlab-free --host gitlab.test --create-namespaces
      - name: Seed the licensed Fixture
        if: matrix.edition == 'ee' && vars.GITLAB_LICENCE_AGREED == 'true'
        run: node scripts/fixtures/seed.ts gitlab-oss --host gitlab.test --create-namespaces
      - name: Read them back
        env:
          ISSUE_MAP_LIVE: ${{ (matrix.edition == 'ee' && vars.GITLAB_LICENCE_AGREED == 'true') && 'gitlab-free,gitlab-oss' || 'gitlab-free' }}
          ISSUE_MAP_LIVE_GITLAB_HOST: gitlab.test
        run: npm run test:live
      - if: failure()
        run: docker logs --tail 300 gitlab

  # The EE schemas a run recorded arrive through a pull request, as GHES's do, for the contract tier to check the GitLab adapter's queries against.
  schemas:
    needs: gitlab
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gitlab-*-ee-schema
          path: recorded
      - id: record
        run: |
          mkdir -p recorded
          {
            echo "changed<<EOF"
            node scripts/ci/schemas.ts gitlab recorded
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm -rf recorded
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: ci/gitlab-schemas
          commit-message: Record the GitLab matrix's EE GraphQL schemas
          title: Record the GitLab matrix's EE GraphQL schemas
          body: |
            The GitLab version matrix recorded EE schemas the Map's schema checks don't hold yet (ADR 0004):

            ${{ steps.record.outputs.changed }}

            The contract tier checks every query the GitLab adapter sends a promised GitLab against them.

  drift:
    needs: gitlab
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an Issue, or add to the one open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The GitLab version matrix failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again on $(date -u +%F): $RUN"
          else
            gh issue create --title "$title" --body "A promised GitLab read the GitLab Free Fixture differently from what test/live/fixtures.ts declares, or couldn't be seeded: $RUN. Fix it in a patch release (ADR 0004)."
          fi
