# The contract tier (ADR 0004), on every change: the contract suite against
# both adapters, and the schema checks that stand in for GHES and GHEC, which
# validate every query the GitHub adapter sends against each promised
# release's published schema. Needs no credentials.
name: Contract

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
