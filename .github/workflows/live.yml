# The live tier (ADR 0004), nightly: the fixture Projects (docs/fixtures.md)
# read through the real adapters on github.com and gitlab.com, which run
# GitHub's and GitLab's code first, so a Tracker's behaviour drifting fails
# here before a release ships against it. github.com is also the running
# stand-in for GHES and GHEC. A nightly failure opens an Issue, or adds to
# the one open.
name: Live

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

env:
  GLAB_VERSION: "1.119.0"
  # glab's published checksum for that version's linux_amd64 .deb; change both together.
  GLAB_SHA256: "95a9ca105518dec7f70ee403d98501402a5fda154c406f4f4cd6696928d3a098"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install glab
        run: |
          curl -fsSL -o glab.deb "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${GLAB_VERSION}/glab_${GLAB_VERSION}_linux_amd64.deb"
          echo "$GLAB_SHA256  glab.deb" | sha256sum -c -
          sudo dpkg -i glab.deb
      # The namespaces test/live/fixtures.ts names, and nowhere else.
      - name: Name the fixture namespaces
        id: names
        run: node test/live/fixtures.ts names >> "$GITHUB_OUTPUT"
      # Read as the fixtures' GitHub App, never a personal login, installed on the main organisation.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        with:
          client-id: ${{ vars.FIXTURES_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIXTURES_APP_PRIVATE_KEY }}
          owner: ${{ steps.names.outputs.GH_MAIN }}
      - name: Read the fixture Projects
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITLAB_TOKEN: ${{ secrets.FIXTURES_GITLAB_TOKEN }}
          GITLAB_HOST: gitlab.com
          # `gitlab-oss` joins once GitLab for Open Source licenses its group (docs/fixtures.md).
          ISSUE_MAP_LIVE: ${{ vars.ISSUE_MAP_LIVE || 'github,gitlab-free' }}
        run: npm run test:live

  drift:
    needs: live
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an Issue, or add to the one open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly live reads of the fixture Projects failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again on $(date -u +%F): $RUN"
          else
            gh issue create --title "$title" --body "A Tracker read the fixture Projects differently from what test/live/fixtures.ts declares, or couldn't be read: $RUN. Fix it in a patch release (ADR 0004)."
          fi
