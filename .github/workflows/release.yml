# A release (ADR 0004): tagged only from a commit where every tier passed.
# Run by hand with the version to release. It runs all three tiers on the
# commit it was started on, in this run, and tags and releases that commit
# only once every one of them is green, so no earlier run on another commit
# or with other results can stand in for them.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, as in .claude-plugin/plugin.json, such as 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Released from main, as a version the plugin declares and hasn't released yet
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::a release is made from main, not $GITHUB_REF"; exit 1; fi
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::$VERSION isn't a version such as 0.1.0"; exit 1; fi
          declared=$(node -p 'require("./.claude-plugin/plugin.json").version')
          if [ "$declared" != "$VERSION" ]; then echo "::error::.claude-plugin/plugin.json says $declared, not $VERSION"; exit 1; fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then echo "::error::v$VERSION is already tagged"; exit 1; fi

  contract:
    needs: check
    uses: ./.github/workflows/contract.yml

  live:
    needs: check
    uses: ./.github/workflows/live.yml
    secrets: inherit
    # What the called workflow's jobs may ask for; only a nightly run files an Issue.
    permissions:
      contents: read
      issues: write

  gitlab:
    needs: check
    uses: ./.github/workflows/gitlab-matrix.yml
    secrets: inherit
    # What the called workflow's jobs may ask for, checked before any of them starts: its schemas job opens a pull
    # request with the EE schemas the full matrix recorded, and only a scheduled run files an Issue.
    permissions:
      contents: write
      pull-requests: write
      issues: write

  release:
    needs: [contract, live, gitlab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and release the commit every tier passed on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
