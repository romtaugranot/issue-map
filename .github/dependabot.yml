# Keeps the actions pinned to commit SHAs, and the dev dependencies, up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The typings follow the Node floor, 22.18, so typecheck catches newer APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
